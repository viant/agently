<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
<title id="title">Agently architecture</title>
<desc id="desc">Web, native mobile, CLI and custom clients connect through authenticated AG-UI runs and application APIs to Agently Core. Core executes agents using model providers, tools and durable storage. Workspace resources configure behavior and UI metadata. Forge renders the web and native UI.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<style>
