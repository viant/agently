.heading{font-size:21px;font-weight:700}.label{font-size:17px;font-weight:700}.detail{font-size:14px;fill:#526176}.section{font-size:12px;font-weight:700;letter-spacing:1.5px;fill:#526176}
.link{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
</style>
<rect width="960" height="620" rx="16" fill="#ffffff"/>
<text x="32" y="40" class="heading">Agently architecture</text>
<text x="32" y="65" class="detail">Configurable agents, durable execution and interactive applications</text>

