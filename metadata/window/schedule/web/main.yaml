namespace: Automation

view:
  content:
    containers:
      - id: automationGuidance
        title: Automations
        dataSourceRef: schedules
        visibleWhen:
          all:
            - source: collection
              empty: true
            - source: windowForm
              field: automationView
              notEquals: editor
        table: $import('table/schedules.yaml')

      - id: automationEditor
        title: Setup
        dataSourceRef: schedules
        visibleWhen:
          source: windowForm
          field: automationView
          equals: editor
        toolbar: $import('toolbar/setup.yaml')
        tabs:
          vertical: false
        containers: $import('form.yaml')

      - id: automationCatalogue
        title: Automations
        dataSourceRef: schedules
        visibleWhen:
          all:
            - source: collection
              notEmpty: true
            - source: windowForm
              field: automationView
              notEquals: editor
        table: $import('table/schedules.yaml')


dataSource:
  schedules: $import('datasource/schedules.yaml')
  agentsLov: $import('datasource/agents_lov.yaml')
  modelsLov: $import('datasource/models_lov.yaml')

dialogs:
  - id: agentLov
    title: Select Agent
    dataSourceRef: agentsLov
    on:
      - event: onOpen
        handler: schedule.applyLookupFilter
    content:
      fetchData: true
      table:
        columns:
          - id: name
            name: Agent Name
          - id: id
            name: Agent ID

  - id: modelLov
    title: Select Model
    dataSourceRef: modelsLov
    content:
      fetchData: true
      table:
        columns:
          - id: name
            name: Model
          - id: id
            name: Model ID
