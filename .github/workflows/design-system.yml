name: Design system contracts
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    name: Design system contracts
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: agently/ui
    env:
      PLAYWRIGHT_CHANNEL: chromium
      APPSERVER_URL: http://127.0.0.1:9191
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: agently
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # checkout requires a full commit SHA; abbreviated IDs are treated as refs.
          repository: viant/agently-core
          ref: d7b6e6495135d9b8e8b3522c20fc7a636d775389
          path: agently-core
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: viant/forge
          ref: 3fe1b7d52b9d32861fbc3006acca1ebdde40a4b2
          path: forge
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: agently/ui/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: agently/go.mod
          cache-dependency-path: agently/go.sum
      - name: Verify host metadata and workspace style boundaries
        working-directory: agently
        run: go test ./preview/window -run 'TestFoundationMetadataSurvivesHostLoading|TestWorkspaceStylesAreVersionedAndReloaded|TestChartPresentationSurvivesHostLoading'
      - name: Install Core SDK source dependencies
        working-directory: agently-core/sdk/ts
        run: npm ci
      - name: Install Forge source dependencies
        working-directory: forge
        run: npm ci
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx vitest run src/services/workspaceStyles.test.js src/typographyContract.test.js src/components/WorkspaceSidebar.menuDelivery.test.jsx src/components/WorkspaceSidebar.test.jsx src/components/Sidebar.test.js src/components/TurnProgressStatus.test.js src/components/TurnProgressStatus.publicTask.render.test.jsx src/components/Root.test.jsx src/components/AppSectionContent.test.jsx src/services/workspaceQueryContext.test.js src/services/chatService.submit.test.js src/components/ReportWindow.test.jsx src/components/ReportWindow.wire.test.jsx src/services/reportChoiceService.test.js src/services/reportFilterParameters.test.js src/components/MenuBar.test.jsx src/components/ConversationWorkspaceSurface.test.jsx src/hooks/shellNavigation.test.jsx src/services/conversationWindow.test.js src/services/chatRuntime.test.js src/services/chatRuntime.feeds.test.js src/services/chatRuntime.terminalStage.test.js src/components/chat/ChatFeedFromChatStore.test.js src/components/chat/historyScroll.test.js src/services/workspaceSession.test.js src/components/lookups/NamedLookupInput.focus.test.jsx --testTimeout=15000
      - run: node vite.config.test.mjs
      - run: npm run test:typography
      - run: npm run test:window-scroll
        working-directory: agently/ui
      - run: npm run build
      - name: Verify embedded UI bundle
        working-directory: agently
        run: bash ui/scripts/sync-deployment-ui.sh && go test ./deployment/ui . -run 'TestEmbedded|TestRouterServesCompleteEmbeddedBundle'
      - name: Check contributor entry points
        working-directory: agently
        run: test -f AGENTS.md && test -f CLAUDE.md && test -f .cursor/rules/design-system.mdc
