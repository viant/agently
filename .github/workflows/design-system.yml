name: Design system contracts
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    name: Design system contracts
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: agently/ui
    env:
      PLAYWRIGHT_CHANNEL: chromium
      APPSERVER_URL: http://127.0.0.1:9191
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: agently
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: viant/agently-core
          ref: 02b29b1e1e4c24ffec51f21254a01b5530a1915c
          path: agently-core
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: viant/forge
          ref: 7e3be5d37946bc918457b77aa2612d9fb85ad13f
          path: forge
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: agently/ui/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: agently/go.mod
          cache-dependency-path: agently/go.sum
      - name: Verify host metadata and workspace style boundaries
        working-directory: agently
        run: go test ./preview/window -run 'TestFoundationMetadataSurvivesHostLoading|TestWorkspaceStylesAreVersionedAndReloaded|TestChartPresentationSurvivesHostLoading'
      - name: Install Core SDK source dependencies
        working-directory: agently-core/sdk/ts
        run: npm ci
      - name: Install Forge source dependencies
        working-directory: forge
        run: npm ci
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx vitest run src/services/workspaceStyles.test.js src/typographyContract.test.js src/components/WorkspaceSidebar.menuDelivery.test.jsx src/components/WorkspaceSidebar.test.jsx src/components/Sidebar.test.js src/components/TurnProgressStatus.test.js src/components/TurnProgressStatus.publicTask.render.test.jsx src/components/Root.test.jsx src/components/MenuBar.test.jsx src/components/ConversationWorkspaceSurface.test.jsx src/hooks/shellNavigation.test.jsx src/services/conversationWindow.test.js src/components/chat/ChatFeedFromChatStore.test.js src/components/chat/historyScroll.test.js src/services/workspaceSession.test.js src/components/lookups/NamedLookupInput.focus.test.jsx --testTimeout=15000
      - run: node vite.config.test.mjs
      - run: npm run test:typography
      - run: npm run build
      - name: Check contributor entry points
        working-directory: agently
        run: test -f AGENTS.md && test -f CLAUDE.md && test -f .cursor/rules/design-system.mdc
