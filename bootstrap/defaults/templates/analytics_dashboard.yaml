id: analytics_dashboard
name: analytics_dashboard
description: Canonical analytical report contract for Markdown findings plus scoped report data.
format: forge_report_data
platforms:
  - web
  - android
  - ios
formFactors:
  - desktop
  - tablet
  - phone
surfaces:
  - chat
  - browser
  - app
appliesTo:
  - chatter
fences:
  - lang: forge-data
    required: true
    repeatable: true
    order: 1
    description: Version-2 materialized data owned by one report instance.
    schema:
      type: object
      required: [version, scope, reportRef, id, sequence, format, mode, data]
      properties:
        version:
          const: 2
        scope:
          type: string
        reportRef:
          type: string
        id:
          type: string
        sequence:
          type: integer
          minimum: 1
        format:
          enum: [json, csv]
        mode:
          enum: [replace, append, patch]
        data:
          description: Row-oriented JSON array or CSV with a header row.
  - lang: forge-report
    required: true
    repeatable: true
    order: 2
    description: Version-1 progressive dashboard report transactions.
    schema:
      type: object
      required: [version, scope, id, sequence, mode]
      properties:
        version:
          const: 1
        scope:
          type: string
        id:
          type: string
        sequence:
          type: integer
          minimum: 1
        mode:
          enum: [start, append, patch, replace, commit]
        grammar:
          enum: [dashboard-v1]
        title:
          type: string
        blocks:
          type: array
instructions: |
  Return a short Markdown findings section followed by one canonical report.

  Markdown rules:
  - Use one concise heading and 2-4 flat evidence-based bullets.
  - Put Markdown before the first fence; never put prose between report transactions.
  - Omit Markdown only when the user explicitly requests fences only.

  Transaction rules:
  - Never emit a `forge-ui` fence for reporting.
  - Use one stable `scope` and report `id`.
  - Emit each datasource first as `forge-data` version 2 with matching `reportRef`.
  - Use a shared, strictly increasing `sequence` across data and report transactions.
  - Start the report with `forge-report` version 1, `mode: "start"`, and `grammar: "dashboard-v1"`.
  - Finish with exactly one `forge-report` transaction using `mode: "commit"`.
  - Fence opening lines are exactly ````forge-data``` and ````forge-report```.
  - Put one bare JSON object inside each fence.
  - Use only supplied or observed data; never invent rows unless the user explicitly asks for sample data.

  Data rules:
  - Use row-oriented JSON arrays or CSV with a header row for tables and charts.
  - Use raw numbers. Apply display formatting in report block metadata.
  - Every `dataSourceRef` must exactly match a `forge-data.id` in the same report transaction stream.

  Dashboard blocks:
  - Every block requires a stable unique `id` and an exact supported `kind`.
  - Use `dashboard.summary` with `dataSourceRef` and `metrics` entries containing `field`, `label`, and optional `format`.
  - Use `dashboard.timeline` with `dataSourceRef` and `chart` containing `type`, `xAxis.dataKey`, and `series.valueKey` or `series.values`.
  - Use `dashboard.table` with `dataSourceRef` and `columns` containing `key`, `label`, and optional `format`.
  - Other supported kinds include `dashboard.kpiTable`, `dashboard.compare`, `dashboard.dimensions`, `dashboard.status`, `dashboard.filters`, `dashboard.feed`, `dashboard.report`, `dashboard.detail`, `dashboard.messages`, and `dashboard.badges`.
  - Use `kind`, never `type`; use `dataSourceRef`, never `dataSource`.
  - Use `currency`, `compactNumber`, `percent`, or `percentFraction` formats as appropriate.

examples:
  - title: Markdown plus quarterly performance report
    markdown: |
      ### Key findings
      - Spend and delivered volume increased through the quarter.
      - March recorded the highest impressions and spend.
    fences:
      - lang: forge-data
        body:
          version: 2
          scope: quarterly_demo
          reportRef: quarterly_performance
          id: monthly_performance
          sequence: 1
          format: json
          mode: replace
          data:
            - month: January
              impressions: 1250000
              clicks: 18750
              spend: 45210.75
            - month: February
              impressions: 1385000
              clicks: 21430
              spend: 49880.20
            - month: March
              impressions: 1492000
              clicks: 23890
              spend: 53440.60
      - lang: forge-report
        body:
          version: 1
          scope: quarterly_demo
          id: quarterly_performance
          sequence: 2
          mode: start
          grammar: dashboard-v1
          title: Quarterly Media Performance
          blocks:
            - id: quarterly_summary
              kind: dashboard.summary
              dataSourceRef: monthly_performance
              metrics:
                - field: impressions
                  label: Impressions
                  format: compactNumber
                - field: clicks
                  label: Clicks
                  format: compactNumber
                - field: spend
                  label: Spend
                  format: currency
            - id: spend_timeline
              kind: dashboard.timeline
              title: Monthly Spend
              dataSourceRef: monthly_performance
              chart:
                type: line
                xAxis:
                  dataKey: month
                series:
                  valueKey: spend
            - id: monthly_table
              kind: dashboard.table
              title: Monthly Detail
              dataSourceRef: monthly_performance
              columns:
                - key: month
                  label: Month
                - key: impressions
                  label: Impressions
                  format: compactNumber
                - key: clicks
                  label: Clicks
                  format: compactNumber
                - key: spend
                  label: Spend
                  format: currency
      - lang: forge-report
        body:
          version: 1
          scope: quarterly_demo
          id: quarterly_performance
          sequence: 3
          mode: commit
