id: changes
presentation:
  icon: changes
  accent: teal
match:
  service: system/patch
  method: apply
activation:
  kind: tool_call
  service: system/patch
  method: snapshot


dataSource:
  snapshot:
    source: output

  changes:
    dataSourceRef: snapshot
    uniqueKey:
      - field: url
    selectors:
      data: changes


ui:
  title: Changes
  containers:
    - id: changes
      dataSourceRef: changes
      fileBrowser:
        title: Browser
        dedupeBy: url
        display: tree
        pathField: url
        preview:
          kind: codeDiff
          tool: system_patch-preview
          defaultMode: diff
          currentField: url
          previousField: origUrl
          diffField: diff
          modes: [diff, current, prev]
        className: app-feed-browser app-feed-browser-changes
        style:
          height: min(18vh, 180px)
          background: '#fffdfa'
          border: 1px solid #ead9cb
          borderRadius: 10px
          padding: 6px 8px
    - id: toolbar
      dataSourceRef: snapshot
      style:
        marginTop: 8px
        background: '#fff'
        border: 1px solid #eadfd4
        borderRadius: 10px
        padding: 6px 8px
      toolbar:
        className: app-feed-toolbar app-feed-toolbar-actions
        items:
          - id: revert
            label: Revert
            icon: undo
            appearance: minimal
            align: right
            on:
              - event: onClick
                handler: tool.execute
                target:
                  name: system_patch-rollback
                  arguments: {}
                  successMessage: Changes reverted.

          - id: apply
            label: Apply
            icon: tick
            intent: primary
            align: right
            on:
              - event: onClick
                handler: tool.execute
                target:
                  name: system_patch-commit
                  arguments: {}
                  successMessage: Changes applied.
