name: AgentlyApp

options:
  bundleIdPrefix: com.viant.agently
  deploymentTarget:
    iOS: "17.0"

packages:
  AgentlyAppFoundation:
    path: .

settings:
  base:
    SWIFT_VERSION: 5.9
    PRODUCT_NAME: Agently
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    AGENTLY_GIT_REVISION: unknown
    AGENTLY_GIT_VERSION: unknown
    AGENTLY_WORKSPACE_ENDPOINT: https://steward.agently.viantinc.com/

targets:
  AgentlyApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.viant.agently.ios
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - package: AgentlyAppFoundation
        product: AgentlyAppFoundation
    scheme:
      testTargets: []

  AgentlyAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests/AgentlyAppUITests
    settings:
      base:
        PRODUCT_NAME: AgentlyAppUITests
        PRODUCT_MODULE_NAME: AgentlyAppUITests
        PRODUCT_BUNDLE_IDENTIFIER: com.viant.agently.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AgentlyApp
    dependencies:
      - target: AgentlyApp

schemes:
  AgentlyAppLiveUITests:
    build:
      targets:
        AgentlyApp: all
        AgentlyAppUITests: test
    test:
      targets:
        - AgentlyAppUITests
      environmentVariables:
        AGENTLY_IOS_LIVE_UI_TESTS: "1"
